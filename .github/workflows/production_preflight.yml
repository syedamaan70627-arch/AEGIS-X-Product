name: AEGIS-X Production Preflight CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  preflight-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Production Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Production Preflight Guard
        run: |
          python scripts/production_preflight.py

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest -q
